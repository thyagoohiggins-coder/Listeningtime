name: Teste no emulador Android

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths: ["app/**", ".github/workflows/smoke-test.yml", ".github/scripts/smoke.sh"]

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK de teste
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir o app no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulador
          path: |
            logcat.txt
            screen-*.png
