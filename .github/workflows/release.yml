name: Build e Release do APK

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Definir versão (sempre crescente)
        run: |
          # versionCode = minutos desde 01/01/2025 -> cada build é maior que a anterior,
          # então o Android aceita instalar por cima sem erro de "downgrade".
          CODE=$(( ( $(date -u +%s) - 1735689600 ) / 60 ))
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Keystore (secrets do repositório)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Cadastre os secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS e KEY_PASSWORD (Settings > Secrets and variables > Actions). Sem a MESMA chave em todas as builds o Android recusa instalar a atualização por cima."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          # garante que o APK saiu assinado
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/ListeningTime-v${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ListeningTime-v${{ env.VERSION_NAME }}
          path: out/*.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Listening Time v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: out/*.apk
          body: |
            Build automática do commit ${{ github.sha }} (branch `${{ github.ref_name }}`).
            versionCode: ${{ env.VERSION_CODE }}

            Baixe o APK abaixo e instale por cima da versão anterior — seus dados são mantidos.
