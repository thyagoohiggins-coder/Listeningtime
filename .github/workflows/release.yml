name: Build e Release do APK

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "sync-worker/**", "wrangler.toml", ".github/workflows/deploy-sync.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Definir versão (sempre crescente)
        run: |
          # versionCode = minutos desde 01/01/2025 -> cada build é maior que a anterior,
          # então o Android aceita instalar por cima sem erro de "downgrade".
          CODE=$(( ( $(date -u +%s) - 1735689600 ) / 60 ))
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Keystore (secrets do repositório)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Cadastre os secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS e KEY_PASSWORD (Settings > Secrets and variables > Actions). Sem a MESMA chave em todas as builds o Android recusa instalar a atualização por cima."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          # garante que o APK saiu assinado
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/ListeningTime-v${VERSION_NAME}.apk"

      - name: Empacotar extensão de navegador (Chrome/Edge e Firefox)
        run: |
          for target in chrome firefox; do
            rm -rf build-ext && cp -r extension build-ext
            if [ "$target" = firefox ]; then
              jq --arg v "$VERSION_NAME" '.version=$v
                | .background={"scripts":["shared.js","background.js"]}
                | .browser_specific_settings={"gecko":{"id":"listeningtime@thyagoohiggins.github.io","strict_min_version":"121.0"}}' \
                extension/manifest.json > build-ext/manifest.json
            else
              jq --arg v "$VERSION_NAME" '.version=$v' extension/manifest.json > build-ext/manifest.json
            fi
            (cd build-ext && zip -qr "../out/ListeningTime-extensao-${target}-v${VERSION_NAME}.zip" .)
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ListeningTime-v${{ env.VERSION_NAME }}
          path: out/*

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Listening Time v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: out/*
          body: |
            Build automática do commit ${{ github.sha }} (branch `${{ github.ref_name }}`).
            versionCode: ${{ env.VERSION_CODE }}

            **Android:** baixe o `.apk` e instale por cima da versão anterior — seus dados são mantidos.
            **Chrome/Edge:** baixe o zip `chrome`, extraia, abra `chrome://extensions`, ative o *Modo do desenvolvedor* e clique em *Carregar sem compactação*.
            **Firefox:** baixe o zip `firefox` e carregue em `about:debugging` → *Este Firefox* → *Carregar extensão temporária*.
