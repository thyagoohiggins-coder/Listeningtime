# Servidor de sincronização (Cloudflare Worker). O código fica em sync-worker/.
# Este arquivo na raiz permite publicar direto pelo "Import a repository" do Cloudflare.
name = "listeningtime"
main = "sync-worker/src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "SYNC"
class_name = "SyncSpace"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncSpace"]
